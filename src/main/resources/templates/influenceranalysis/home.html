<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinbabel · Influencer Signal Lab</title>
  <link rel="stylesheet" th:href="@{/css/pinbabel.css}" href="/css/pinbabel.css">
  <script defer th:src="@{/vendor/htmx/htmx-2.0.10.min.js}" src="/vendor/htmx/htmx-2.0.10.min.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" th:href="@{/}" href="/" aria-label="Pinbabel 처음으로">
    <span class="brand-mark" aria-hidden="true">P</span>
    <span>PINBABEL</span>
  </a>
  <span class="header-note">EMBABEL SIGNAL LAB / 01</span>
</header>

<main>
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-grid">
      <div>
        <h1 id="page-title">주식 인플루언서</h1>
      </div>
      <div class="hero-aside">
        <a class="primary-action"
           th:href="@{/influencers}" href="/influencers"
           hx-get="/influencers" hx-target="#directory-results" hx-swap="innerHTML">
          인플루언서 조회
          <span aria-hidden="true">↘</span>
        </a>
      </div>
    </div>
  </section>

  <section id="directory-results" class="directory-shell"
           th:classappend="${directory == null} ? ' directory-shell--empty'"
           aria-live="polite" aria-label="인플루언서 목록">
    <th:block th:if="${directory != null}">
      <div th:replace="~{influenceranalysis/fragments/profile-list :: profileList}"></div>
    </th:block>
  </section>

  <aside class="disclaimer">
    <strong>NOTICE</strong>
    <p>공개 SNS 발언에 대한 자동 분석이며 투자 자문, 매수·매도 추천 또는 수익 보장이 아닙니다.</p>
  </aside>
</main>
</body>
</html>
