databaseChangeLog:
  - changeSet:
      id: 2026-08-24-000-create-modulith-event-publication-table
      author: ypkim
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: publication_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: listener_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: timestamp with time zone
              - column:
                  name: last_resubmission_date
                  type: timestamp with time zone
              - column:
                  name: completion_attempts
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
      rollback:
        - dropTable:
            tableName: event_publication
