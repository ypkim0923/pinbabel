spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: pinbabel
  datasource:
    url: ${PINBABEL_DB_URL:jdbc:mysql://127.0.0.1:3306/pinbabel?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${PINBABEL_DB_USERNAME:pinbabel}
    password: ${PINBABEL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_boolean_jdbc_type: TINYINT
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

pinbabel:
  analysis-run:
    max-events: 1000

embabel:
  agent:
    shell:
      web-application-type: servlet
      interactive:
        enabled: false
        history-enabled: false
